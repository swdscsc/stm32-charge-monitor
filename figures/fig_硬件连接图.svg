<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#64748b}.h{font-size:19px;font-weight:700}.s{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arr)}.dash{stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arr)}.panel{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.sensor{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.mcu{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.act{fill:#fff1f2;stroke:#e11d48;stroke-width:1.6}.ui{fill:#fffbeb;stroke:#d97706;stroke-width:1.6}.opt{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}</style><rect width="1440" height="960" fill="#f8fafc"/>
<text x="70" y="72" class="title">硬件功能连接图</text><text x="70" y="105" class="sub">依据当前 main.h / main.c 引脚定义；功能连接示意，不是可直接投板的完整电气原理图</text><rect x="45" y="135" width="1350" height="760" rx="22" class="panel"/>
<rect x="80" y="210" width="270" height="120" rx="16" class="sensor"/><text x="215" y="249" text-anchor="middle" class="h">INA219 模块</text><text x="215" y="277" text-anchor="middle" class="s">IN+ / IN− 串入低压回路</text><text x="215" y="300" text-anchor="middle" class="s">I²C 地址 0x40</text>
<rect x="80" y="385" width="270" height="120" rx="16" class="sensor"/><text x="215" y="424" text-anchor="middle" class="h">NTC 10k / B3950</text><text x="215" y="452" text-anchor="middle" class="s">3.3V—10k—PA0—NTC—GND</text><text x="215" y="475" text-anchor="middle" class="s">ADC1_IN0 · PA0</text>
<rect x="80" y="560" width="270" height="120" rx="16" class="ui"/><text x="215" y="599" text-anchor="middle" class="h">SSD1306 OLED</text><text x="215" y="627" text-anchor="middle" class="s">PB6 / PB7 · I²C1</text><text x="215" y="650" text-anchor="middle" class="s">地址按模块扫描核验</text>
<rect x="570" y="320" width="320" height="280" rx="16" class="mcu"/><text x="730" y="359" text-anchor="middle" class="h">STM32F103C8T6</text><text x="730" y="387" text-anchor="middle" class="s">PB6 = I²C1 SCL</text><text x="730" y="410" text-anchor="middle" class="s">PB7 = I²C1 SDA</text><text x="730" y="433" text-anchor="middle" class="s">PA0 = NTC ADC</text><text x="730" y="456" text-anchor="middle" class="s">PA1 = 蜂鸣器控制</text><text x="730" y="479" text-anchor="middle" class="s">PA2 = 继电器控制</text><text x="730" y="502" text-anchor="middle" class="s">PA9 / PA10 = USART1</text>
<rect x="1060" y="210" width="260" height="120" rx="16" class="act"/><text x="1190" y="249" text-anchor="middle" class="h">蜂鸣器驱动级</text><text x="1190" y="277" text-anchor="middle" class="s">PA1 → 驱动三极管 / 模块</text><text x="1190" y="300" text-anchor="middle" class="s">GPIO 不直接带大电流</text>
<rect x="1060" y="385" width="260" height="120" rx="16" class="act"/><text x="1190" y="424" text-anchor="middle" class="h">继电器驱动级</text><text x="1190" y="452" text-anchor="middle" class="s">PA2 → 驱动级 → 线圈</text><text x="1190" y="475" text-anchor="middle" class="s">NO 触点串入低压负载</text>
