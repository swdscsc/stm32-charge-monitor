<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#64748b}.h{font-size:19px;font-weight:700}.s{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arr)}.panel{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.sensor{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.mcu{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.act{fill:#fff1f2;stroke:#e11d48;stroke-width:1.6}.ui{fill:#fffbeb;stroke:#d97706;stroke-width:1.6}.opt{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}</style><rect width="1440" height="1050" fill="#f8fafc"/><text x="65" y="72" class="title">主程序执行流程</text><text x="65" y="105" class="sub">依据 main.c 当前实现；三个周期任务在 while(1) 中独立判断，不是串行阻塞流程</text><rect x="50" y="140" width="1340" height="850" rx="22" class="panel"/>
<rect x="500" y="190" width="440" height="82" rx="16" class="mcu"/><text x="720" y="225" text-anchor="middle" class="h">系统初始化</text><text x="720" y="250" text-anchor="middle" class="s">HAL / 时钟 / GPIO / I²C / ADC / USART / 外设</text><path d="M720 272 V330" class="line"/>
<rect x="500" y="330" width="440" height="78" rx="16" class="mcu"/><text x="720" y="377" text-anchor="middle" class="h">进入 while(1) 主循环</text>
<path d="M720 408 V470" class="line"/><rect x="470" y="470" width="500" height="112" rx="16" class="sensor"/><text x="720" y="510" text-anchor="middle" class="h">任务 A：100ms 采集与保护</text><text x="720" y="540" text-anchor="middle" class="s">INA219 / NTC → 有效性检查 → 滤波 → Protect_Update</text><text x="720" y="563" text-anchor="middle" class="s">传感器故障即时切断；更新继电器与蜂鸣器</text>
<path d="M720 582 V640" class="line"/><rect x="470" y="640" width="500" height="95" rx="16" class="ui"/><text x="720" y="678" text-anchor="middle" class="h">任务 B：500ms OLED 刷新</text><text x="720" y="708" text-anchor="middle" class="s">电压 / 电流 / 温度 / 状态与告警显示</text>
<path d="M720 735 V795" class="line"/><rect x="470" y="795" width="500" height="95" rx="16" class="opt"/><text x="720" y="833" text-anchor="middle" class="h">任务 C：1000ms 可选数据上传</text><text x="720" y="863" text-anchor="middle" class="s">ENABLE_ESP8266 开启时调用 ESP8266_SendData</text>
<path d="M970 520 H1150 V840 H970" class="line"/><text x="1170" y="680" class="s" transform="rotate(90 1170 680)">每轮独立判断</text>
<path d="M970 680 H1260 V370 H940" class="line"/><text x="1280" y="540" class="s" transform="rotate(-90 1280 540)">继续下一轮 while(1)</text>
<rect x="105" y="470" width="280" height="145" rx="16" class="chip"/><text x="245" y="510" text-anchor="middle" class="h">时间基准</text><text x="245" y="542" text-anchor="middle" class="s">SysTick 毫秒计数</text><text x="245" y="570" text-anchor="middle" class="s">now - last ≥ interval</text><path d="M385 540 H470" class="line"/>
<rect x="105" y="700" width="280" height="145" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="245" y="740" text-anchor="middle" class="h">注意</text><text x="245" y="772" text-anchor="middle" class="s">ESP8266 发送当前为</text><text x="245" y="800" text-anchor="middle" class="s">同步调用，可能占用主循环</text><text x="65" y="950" class="s">未启用 ESP8266 时，任务 C 被编译开关裁剪；OLED 与采集任务仍独立按各自周期判断。</text></svg>