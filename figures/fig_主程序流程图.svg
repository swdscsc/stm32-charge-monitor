<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#64748b}.h{font-size:19px;font-weight:700}.s{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arr)}.dash{stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arr)}.panel{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.sensor{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.mcu{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.act{fill:#fff1f2;stroke:#e11d48;stroke-width:1.6}.ui{fill:#fffbeb;stroke:#d97706;stroke-width:1.6}.opt{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}</style><rect width="1200" height="1300" fill="#f8fafc"/>
<text x="65" y="72" class="title">主程序执行流程</text><text x="65" y="105" class="sub">依据 main.c 当前实现；固定周期轮询，无 RTOS</text>
<rect x="380" y="145" width="440" height="74" rx="16" class="mcu"/><text x="600" y="190" text-anchor="middle" class="h">HAL_Init / 时钟与外设初始化</text><path d="M600 219 V265" class="line"/>
<rect x="380" y="265" width="440" height="88" rx="16" class="chip"/><text x="600" y="302" text-anchor="middle" class="h">初始化 INA219 / NTC / OLED / 保护</text><text x="600" y="329" text-anchor="middle" class="s">继电器输出先置为断开状态</text><path d="M600 353 V405" class="line"/>
<rect x="380" y="405" width="440" height="74" rx="16" class="mcu"/><text x="600" y="450" text-anchor="middle" class="h">进入 while(1) 主循环</text><path d="M600 479 V535" class="line"/>
<polygon points="600,535 780,620 600,705 420,620" fill="#fff7ed" stroke="#d97706" stroke-width="1.7"/><text x="600" y="614" text-anchor="middle" class="h">到达 100ms 采样周期？</text><text x="600" y="642" text-anchor="middle" class="s">now - t_sample ≥ SAMPLE_PERIOD_MS</text><path d="M600 705 V755" class="line"/><text x="620" y="735" class="s">是</text>
<rect x="330" y="755" width="540" height="118" rx="16" class="sensor"/><text x="600" y="798" text-anchor="middle" class="h">读取 INA219 与 NTC</text><text x="600" y="828" text-anchor="middle" class="s">INA219 失败或 NTC 无效 → sensor_fault = 1</text><text x="600" y="852" text-anchor="middle" class="s">有效 V/I → 滑动均值；有效温度 → NTC 滤波</text><path d="M600 873 V925" class="line"/>
<rect x="330" y="925" width="540" height="92" rx="16" class="act"/><text x="600" y="963" text-anchor="middle" class="h">Protect_Update(&amp;g_mon)</text><text x="600" y="991" text-anchor="middle" class="s">故障即时切断；超限计数；更新继电器 / 蜂鸣器</text><path d="M600 1017 V1067" class="line"/>
<rect x="330" y="1067" width="540" height="80" rx="16" class="ui"/><text x="600" y="1115" text-anchor="middle" class="h">到达 500ms？刷新 OLED</text><path d="M600 1147 V1197" class="line"/>
<rect x="330" y="1197" width="540" height="78" rx="16" class="opt"/><text x="600" y="1245" text-anchor="middle" class="h">ENABLE_ESP8266 时：到达 1000ms 则发送</text><path d="M870 1107 H1040 V442 H820" class="line"/><text x="1060" y="780" class="s" transform="rotate(-90 1060 780)">继续循环</text><path d="M420 620 H190 V442 H380" class="line"/><text x="205" y="600" class="s">否：继续轮询</text><text x="65" y="1290" class="s">ESP8266_SendData 当前为同步调用，不能描述为完全非阻塞；启用前需实测阻塞时间。</text></svg>