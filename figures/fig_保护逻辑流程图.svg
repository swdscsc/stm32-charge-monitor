<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#64748b}.h{font-size:19px;font-weight:700}.s{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arr)}.dash{stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arr)}.panel{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.sensor{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.mcu{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.act{fill:#fff1f2;stroke:#e11d48;stroke-width:1.6}.ui{fill:#fffbeb;stroke:#d97706;stroke-width:1.6}.opt{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}</style><rect width="1320" height="980" fill="#f8fafc"/>
<text x="65" y="72" class="title">保护状态机</text><text x="65" y="105" class="sub">依据 protect.c / main.h 当前代码；每 100ms 更新一次</text><rect x="60" y="145" width="1200" height="760" rx="22" class="panel"/>
<rect x="470" y="205" width="380" height="130" rx="18" class="mcu"/><text x="660" y="250" text-anchor="middle" class="h">NORMAL 正常</text><text x="660" y="280" text-anchor="middle" class="s">连续 5 次有效安全采样后首次吸合</text><text x="660" y="305" text-anchor="middle" class="s">继电器保持；蜂鸣器关闭</text>
<rect x="95" y="490" width="380" height="140" rx="18" class="ui"/><text x="285" y="535" text-anchor="middle" class="h">ALARM 温度报警</text><text x="285" y="565" text-anchor="middle" class="s">T ≥ 45℃ 连续 5 次</text><text x="285" y="590" text-anchor="middle" class="s">蜂鸣器响；继电器保持吸合</text>
<rect x="845" y="490" width="380" height="160" rx="18" class="act"/><text x="1035" y="535" text-anchor="middle" class="h">CUTOFF 切断闭锁</text><text x="1035" y="565" text-anchor="middle" class="s">T ≥ 60℃ / V ≥ 21V / I ≥ 2.5A</text><text x="1035" y="590" text-anchor="middle" class="s">任一危险条件连续 5 次</text><text x="1035" y="620" text-anchor="middle" class="s">继电器断开；蜂鸣器持续报警</text>
<path d="M520 335 C450 390 360 405 300 490" class="line"/><text x="350" y="405" class="s">温度报警条件</text><path d="M800 335 C880 390 965 405 1020 490" class="line"/><text x="910" y="405" class="s">危险级条件</text><path d="M475 560 H845" class="line"/><text x="660" y="545" text-anchor="middle" class="s">危险级连续 5 次</text>
<path d="M285 490 C285 400 440 390 510 335" class="dash"/><text x="115" y="420" class="s">T &lt; 42℃ 且电压 / 电流安全</text>
<path d="M1035 650 V735" class="dash"/><rect x="855" y="735" width="360" height="105" rx="16" class="chip"/><text x="1035" y="775" text-anchor="middle" class="h">Protect_Recover()</text><text x="1035" y="805" text-anchor="middle" class="s">最近一次采样有效且安全才恢复</text><path d="M855 785 H700 V335" class="dash"/><text x="710" y="755" class="s">软件接口；尚无实体按键调用</text>
<rect x="95" y="735" width="620" height="105" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="125" y="775" class="h">传感器故障优先级最高</text><text x="125" y="805" class="s">INA219 读取失败 / NTC 无效 → 不防抖，立即 CUTOFF</text><path d="M715 785 H845" class="line"/><text x="95" y="875" class="s">继电器高电平吸合、低电平断开是固件假设；实际模块必须断开负载核验。</text></svg>